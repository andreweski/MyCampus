# In the Netlify site settings, add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# before building. Vite bakes those into the site at build time.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Also add BREVO_SMTP_USER, BREVO_SMTP_KEY, and BREVO_FROM in the Netlify site settings.
[[headers]]
  for = "/campus.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/campus.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/send-code"
  to = "/.netlify/functions/send-code"
  status = 200

[[redirects]]
  from = "/api/map-tiles/*"
  to = "/.netlify/functions/map-tiles/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/campus"
  to = "/.netlify/functions/campus"
  status = 200
  force = true

[[redirects]]
  from = "/api/schools"
  to = "/.netlify/functions/schools"
  status = 200
  force = true

[[redirects]]
  from = "/api/places"
  to = "/.netlify/functions/places"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
